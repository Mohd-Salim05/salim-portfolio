<style>
/* ============================================================
   THEME TOKENS
   ============================================================ */
:root{
  --bg:            #0A0D13;
  --bg-2:          #0D1119;
  --surface:       rgba(255,255,255,0.045);
  --surface-2:     rgba(255,255,255,0.028);
  --surface-3:     rgba(255,255,255,0.065);
  --surface-solid: #12151D;
  --border:        rgba(255,255,255,0.09);
  --border-soft:   rgba(255,255,255,0.06);
  --border-strong: rgba(255,255,255,0.16);
  --text:          #F2F4F7;
  --text-muted:    #99A2B3;
  --text-faint:    #5D6675;
  --accent:        #5B8CFF;
  --accent-2:      #7CF2C0;
  --accent-3:      #B592FF;
  --on-accent:     #08111f;
  --accent-soft:   rgba(91,140,255,0.14);
  --accent-glow:   rgba(91,140,255,0.35);
  --mint-soft:     rgba(124,242,192,0.10);
  --mint-border:   rgba(124,242,192,0.25);
  --nav-bg:        rgba(16,19,27,0.72);
  --nav-bg-solid:  rgba(16,19,27,0.94);
  --grid-line:     rgba(255,255,255,0.028);
  --shimmer:       rgba(255,255,255,0.07);
  --shadow-1:      0 1px 2px rgba(0,0,0,0.35);
  --shadow-lift:   0 24px 48px -16px rgba(0,0,0,0.6);
  --shadow-pop:    0 30px 70px -20px rgba(0,0,0,0.75);
}

:root[data-theme="light"]{
  --bg:            #F6F7FB;
  --bg-2:          #EEF1F8;
  --surface:       rgba(255,255,255,0.82);
  --surface-2:     rgba(255,255,255,0.62);
  --surface-3:     rgba(16,24,48,0.045);
  --surface-solid: #FFFFFF;
  --border:        rgba(16,24,48,0.10);
  --border-soft:   rgba(16,24,48,0.07);
  --border-strong: rgba(16,24,48,0.18);
  --text:          #101624;
  --text-muted:    #56607A;
  --text-faint:    #7A8398;
  --accent:        #3461E8;
  --accent-2:      #0E9E74;
  --accent-3:      #7A4BE0;
  --on-accent:     #FFFFFF;
  --accent-soft:   rgba(52,97,232,0.10);
  --accent-glow:   rgba(52,97,232,0.28);
  --mint-soft:     rgba(14,158,116,0.10);
  --mint-border:   rgba(14,158,116,0.26);
  --nav-bg:        rgba(255,255,255,0.78);
  --nav-bg-solid:  rgba(255,255,255,0.95);
  --grid-line:     rgba(16,24,48,0.035);
  --shimmer:       rgba(16,24,48,0.05);
  --shadow-1:      0 1px 2px rgba(16,24,48,0.08);
  --shadow-lift:   0 24px 48px -18px rgba(16,24,48,0.22);
  --shadow-pop:    0 30px 70px -20px rgba(16,24,48,0.35);
}

:root{
  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 24px;
  --r-pill: 999px;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2,.7,.3,1);
  --ease-out: cubic-bezier(.16,1,.3,1);
  --maxw: 1140px;
}

/* ============================================================
   BASE
   ============================================================ */
*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; scroll-padding-top:92px; }
html, body{ max-width:100%; overflow-x:hidden; }
@media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto; } }

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  transition:background .4s var(--ease), color .4s var(--ease);
}
a{ color:inherit; }
ul{ margin:0; padding:0; list-style:none; }
p{ margin:0; }
img{ max-width:100%; display:block; }
button{ font-family:inherit; }
::selection{ background:var(--accent); color:var(--on-accent); }

:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:3px;
  border-radius:4px;
}

.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
}
.skip-link{
  position:absolute; left:50%; top:-60px; transform:translateX(-50%);
  z-index:200; background:var(--accent); color:var(--on-accent);
  padding:10px 18px; border-radius:0 0 var(--r-sm) var(--r-sm);
  font-size:13px; font-weight:600; text-decoration:none;
  transition:top .2s var(--ease);
}
.skip-link:focus{ top:0; }

/* ============================================================
   BACKGROUND DECOR
   ============================================================ */
.bg-decor{ position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden; }
.bg-decor::after{
  content:""; position:absolute; inset:0;
  background-image:linear-gradient(var(--grid-line) 1px, transparent 1px),
                   linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 90% 60% at 50% 0%, #000 20%, transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse 90% 60% at 50% 0%, #000 20%, transparent 78%);
}
.orb{ position:absolute; border-radius:50%; filter:blur(90px); opacity:.55; }
.orb-a{ width:520px; height:520px; top:-220px; left:-160px; background:radial-gradient(circle, var(--accent-glow), transparent 70%); animation:drift 22s ease-in-out infinite; }
.orb-b{ width:460px; height:460px; top:-120px; right:-180px; background:radial-gradient(circle, rgba(124,242,192,0.26), transparent 70%); animation:drift 26s ease-in-out infinite reverse; }
.orb-c{ width:520px; height:520px; bottom:-10%; left:35%; background:radial-gradient(circle, rgba(181,146,255,0.18), transparent 70%); animation:drift 30s ease-in-out infinite; opacity:.4; }
@keyframes drift{
  0%,100%{ transform:translate3d(0,0,0) scale(1); }
  50%{ transform:translate3d(40px,30px,0) scale(1.08); }
}
@media (prefers-reduced-motion: reduce){ .orb{ animation:none; } }

/* ============================================================
   SCROLL PROGRESS
   ============================================================ */
.progress-rail{
  position:fixed; top:0; left:0; right:0; height:3px; z-index:120;
  background:transparent; pointer-events:none;
}
.progress-bar{
  height:100%; width:0%;
  background:linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent-3));
  box-shadow:0 0 14px var(--accent-glow);
  transition:width .08s linear;
}

/* ============================================================
   NAVBAR
   ============================================================ */
.navbar-wrap{
  position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; justify-content:center;
  padding:16px 20px 0;
}
.navbar{
  width:100%; max-width:var(--maxw);
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:8px 8px 8px 18px;
  background:var(--nav-bg);
  border:1px solid var(--border);
  border-radius:var(--r-pill);
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  box-shadow:var(--shadow-1);
  transition:background .3s var(--ease), box-shadow .3s var(--ease), border-color .3s var(--ease);
}
.navbar.scrolled{ background:var(--nav-bg-solid); box-shadow:var(--shadow-lift); }

.brand{
  display:flex; align-items:center; gap:9px;
  font-size:13.5px; font-weight:650; letter-spacing:-0.01em;
  text-decoration:none; color:var(--text);
  min-width:0; white-space:nowrap;
}
.brand-mark{
  width:26px; height:26px; flex-shrink:0; border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:800; color:var(--on-accent);
  background:linear-gradient(135deg, var(--accent), var(--accent-2));
}
.brand-text{ overflow:hidden; text-overflow:ellipsis; }
.brand-text span{ color:var(--text-faint); font-weight:400; }

.nav-right{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
.navlinks{ display:flex; align-items:center; gap:2px; }
.navlinks a{
  position:relative;
  font-size:13px; font-weight:500;
  color:var(--text-muted); text-decoration:none;
  padding:8px 13px; border-radius:var(--r-pill);
  transition:color .18s var(--ease), background .18s var(--ease);
  white-space:nowrap;
}
.navlinks a:hover{ color:var(--text); background:var(--surface-3); }
.navlinks a.active{ color:var(--on-accent); background:var(--accent); box-shadow:0 4px 14px -4px var(--accent-glow); }

.icon-btn{
  display:flex; align-items:center; justify-content:center;
  width:36px; height:36px; flex-shrink:0;
  background:var(--surface-3); border:1px solid var(--border);
  color:var(--text); border-radius:var(--r-pill); cursor:pointer;
  transition:border-color .18s var(--ease), background .18s var(--ease), transform .18s var(--ease);
}
.icon-btn:hover{ border-color:var(--accent); background:var(--accent-soft); transform:translateY(-1px); }
.icon-btn svg{ width:16px; height:16px; }
.navtoggle{ display:none; }
.theme-btn .moon{ display:none; }
:root[data-theme="light"] .theme-btn .moon{ display:block; }
:root[data-theme="light"] .theme-btn .sun{ display:none; }

@media (max-width:900px){
  .navlinks{
    position:absolute; top:calc(100% + 10px); left:0; right:0;
    flex-direction:column; gap:3px;
    background:var(--nav-bg-solid); border:1px solid var(--border); border-radius:var(--r-md);
    padding:10px; backdrop-filter:blur(18px); box-shadow:var(--shadow-lift);
    opacity:0; visibility:hidden; transform:translateY(-8px);
    transition:opacity .22s var(--ease), transform .22s var(--ease), visibility .22s var(--ease);
    max-height:72vh; overflow-y:auto;
  }
  .navlinks.open{ opacity:1; visibility:visible; transform:translateY(0); }
  .navlinks a{ width:100%; padding:11px 14px; }
  .navtoggle{ display:flex; }
}
@media (max-width:430px){
  .navbar-wrap{ padding:12px 12px 0; }
  .navbar{ padding:7px 7px 7px 12px; }
  .brand{ font-size:12px; }
  .brand-text span{ display:none; }
}

/* ============================================================
   HERO
   ============================================================ */
.hero{
  position:relative; max-width:var(--maxw); margin:0 auto;
  padding:132px 24px 8px;
}
.hero-main{ position:relative; z-index:1; display:flex; align-items:flex-start; gap:30px; flex-wrap:wrap; }

.avatar-wrap{ position:relative; width:112px; height:112px; flex-shrink:0; }
.avatar-ring{
  position:absolute; inset:-5px; border-radius:50%;
  background:conic-gradient(from 0deg, var(--accent), var(--accent-2), var(--accent-3), var(--accent));
  animation:spin 9s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce){ .avatar-ring{ animation:none; } }
.avatar-glow{ position:absolute; inset:-22px; border-radius:50%; background:radial-gradient(circle, var(--accent-glow), transparent 70%); filter:blur(12px); }
.avatar{
  position:relative; width:112px; height:112px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  font-size:34px; font-weight:700; color:var(--text);
  background:linear-gradient(160deg, var(--surface-solid), var(--bg-2));
  border:3px solid var(--bg);
}
.avatar img{ width:100%; height:100%; object-fit:cover; border-radius:50%; }
.avatar-badge{
  position:absolute; right:2px; bottom:2px; z-index:2;
  width:26px; height:26px; border-radius:50%;
  background:var(--accent-2); border:3px solid var(--bg);
  display:flex; align-items:center; justify-content:center;
}
.avatar-badge::after{ content:""; width:7px; height:7px; border-radius:50%; background:var(--bg); }

.hero-copy{ min-width:0; flex:1 1 420px; }
.role-tag{
  display:inline-flex; align-items:center; gap:8px;
  font-size:12px; font-weight:600; color:var(--accent);
  background:var(--accent-soft); border:1px solid rgba(91,140,255,0.28);
  padding:6px 14px; border-radius:var(--r-pill); margin-bottom:16px;
}
.role-tag .dot{ width:7px; height:7px; border-radius:50%; background:var(--accent-2); box-shadow:0 0 0 0 var(--accent-2); animation:pulse 2.2s ease-out infinite; }
@keyframes pulse{
  0%{ box-shadow:0 0 0 0 rgba(124,242,192,.6); }
  70%{ box-shadow:0 0 0 8px rgba(124,242,192,0); }
  100%{ box-shadow:0 0 0 0 rgba(124,242,192,0); }
}
@media (prefers-reduced-motion: reduce){ .role-tag .dot{ animation:none; } }

.hero h1{
  margin:0 0 10px;
  font-size:clamp(32px,5.2vw,54px); font-weight:800;
  letter-spacing:-0.035em; line-height:1.05;
}
.hero h1 .grad{
  background:linear-gradient(120deg, var(--text) 10%, var(--accent) 55%, var(--accent-2) 95%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.typed-line{
  font-family:var(--mono); font-size:clamp(13px,1.8vw,15.5px); font-weight:500;
  color:var(--accent-2); min-height:1.6em; margin-bottom:14px;
  display:flex; align-items:center; gap:2px;
}
.typed-line .caret{
  display:inline-block; width:2px; height:1.05em; background:var(--accent-2);
  animation:blink 1s step-end infinite; vertical-align:middle;
}
@keyframes blink{ 50%{ opacity:0; } }
.tagline{ color:var(--text-muted); font-size:15.5px; max-width:640px; margin-bottom:22px; }

.contact-row{ display:flex; flex-wrap:wrap; gap:8px; }
.contact-row > a, .contact-row > span{
  display:inline-flex; align-items:center; gap:7px;
  font-size:12.5px; color:var(--text-muted); text-decoration:none;
  border:1px solid var(--border); background:var(--surface);
  padding:7px 14px; border-radius:var(--r-pill);
  transition:color .18s var(--ease), border-color .18s var(--ease), background .18s var(--ease), transform .18s var(--ease);
}
.contact-row a:hover{ color:var(--text); border-color:var(--accent); background:var(--accent-soft); transform:translateY(-2px); }
.contact-row svg{ width:14px; height:14px; flex-shrink:0; opacity:.85; }

.cta-row{ display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; }
.btn{
  display:inline-flex; align-items:center; gap:8px;
  font-size:13.5px; font-weight:650; text-decoration:none; cursor:pointer;
  padding:11px 20px; border-radius:var(--r-pill); border:1px solid transparent;
  transition:transform .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease);
}
.btn svg{ width:15px; height:15px; }
.btn-primary{
  color:var(--on-accent);
  background:linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow:0 10px 24px -10px var(--accent-glow);
}
.btn-primary:hover{ transform:translateY(-2px); box-shadow:0 16px 30px -10px var(--accent-glow); }
.btn-ghost{ color:var(--text); background:var(--surface); border-color:var(--border); }
.btn-ghost:hover{ transform:translateY(-2px); border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }

/* KPI */
.kpi-grid{
  position:relative; z-index:1;
  display:grid; grid-template-columns:repeat(4,1fr); gap:14px;
  margin-top:48px;
}
.kpi{
  position:relative; overflow:hidden;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
  padding:20px 22px;
  transition:transform .22s var(--ease), border-color .22s var(--ease), box-shadow .22s var(--ease);
}
.kpi::after{
  content:""; position:absolute; inset:0; opacity:0;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%), var(--accent-soft), transparent 60%);
  transition:opacity .3s var(--ease); pointer-events:none;
}
.kpi:hover{ transform:translateY(-4px); border-color:rgba(91,140,255,0.4); box-shadow:var(--shadow-lift); }
.kpi:hover::after{ opacity:1; }
.kpi .num{
  position:relative; z-index:1;
  font-size:30px; font-weight:800; letter-spacing:-0.03em; line-height:1.1;
  background:linear-gradient(135deg, var(--text), var(--accent) 140%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.kpi .lbl{ position:relative; z-index:1; font-size:11.5px; color:var(--text-muted); margin-top:6px; letter-spacing:.01em; }

@media (max-width:760px){ .kpi-grid{ grid-template-columns:repeat(2,1fr); margin-top:36px; } }
@media (max-width:540px){
  .hero{ padding:104px 18px 4px; }
  .hero-main{ gap:18px; }
  .avatar, .avatar-wrap{ width:84px; height:84px; }
  .avatar{ font-size:26px; }
  .kpi{ padding:16px 16px; }
  .kpi .num{ font-size:24px; }
}

/* ============================================================
   LAYOUT / PANELS
   ============================================================ */
main{ max-width:var(--maxw); margin:0 auto; padding:64px 24px 110px; display:flex; flex-direction:column; gap:24px; }

.panel{
  position:relative;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:38px 40px; box-shadow:var(--shadow-1);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  opacity:0; transform:translateY(22px);
  transition:opacity .6s var(--ease-out), transform .6s var(--ease-out);
}
.panel.is-visible{ opacity:1; transform:translateY(0); }
@media (prefers-reduced-motion: reduce){ .panel{ opacity:1; transform:none; transition:none; } }

.panel-head{ display:flex; align-items:center; gap:13px; margin-bottom:28px; }
.panel-head .bar{ width:4px; height:22px; border-radius:var(--r-pill); background:linear-gradient(180deg, var(--accent), var(--accent-2)); }
.panel-head h2{ margin:0; font-size:20px; font-weight:750; letter-spacing:-0.02em; }
.panel-head .count{
  margin-left:auto; font-size:11px; font-family:var(--mono); color:var(--text-faint);
  border:1px solid var(--border); padding:4px 10px; border-radius:var(--r-pill);
}

@media (max-width:680px){
  main{ padding:48px 16px 80px; gap:18px; }
  .panel{ padding:26px 20px; border-radius:var(--r-md); }
  .panel-head{ margin-bottom:22px; }
}

/* ============================================================
   PROSE
   ============================================================ */
.prose p{ color:var(--text-muted); margin-bottom:14px; font-size:15px; max-width:780px; }
.prose p:last-child{ margin-bottom:0; }
.prose strong{ color:var(--text); font-weight:600; }

/* ============================================================
   SKILLS
   ============================================================ */
.skill-groups{ display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:16px; }
.skill-group{
  background:var(--surface-2); border:1px solid var(--border-soft);
  border-radius:var(--r-md); padding:18px 20px;
  transition:border-color .22s var(--ease), transform .22s var(--ease), background .22s var(--ease);
}
.skill-group:hover{ border-color:rgba(91,140,255,0.3); transform:translateY(-3px); }
.skill-group .g-title{
  display:flex; align-items:center; gap:8px;
  font-size:11.5px; font-weight:700; color:var(--text); text-transform:uppercase;
  letter-spacing:.07em; margin-bottom:14px;
}
.skill-group .g-title svg{ width:15px; height:15px; color:var(--accent); flex-shrink:0; }
.chip-list{ display:flex; flex-wrap:wrap; gap:7px; }
.chip{
  font-size:12px; font-weight:500; padding:6px 11px; border-radius:var(--r-pill);
  color:var(--accent); background:var(--accent-soft); border:1px solid rgba(91,140,255,0.2);
  transition:transform .15s var(--ease), background .15s var(--ease), border-color .15s var(--ease);
}
.chip:hover{ transform:translateY(-2px); background:rgba(91,140,255,0.22); border-color:var(--accent); }

@media (max-width:520px){ .skill-groups{ grid-template-columns:1fr; } }

/* ============================================================
   TIMELINE
   ============================================================ */
.tl-entry{ margin-bottom:34px; }
.tl-entry:last-child{ margin-bottom:0; }
.tl-head{ display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:baseline; margin-bottom:3px; }
.tl-head .org{ font-size:16.5px; font-weight:750; letter-spacing:-0.015em; }
.tl-head .period{
  font-size:12px; color:var(--accent-2); font-family:var(--mono);
  background:var(--mint-soft); border:1px solid var(--mint-border);
  padding:4px 11px; border-radius:var(--r-pill);
}
.tl-role{ color:var(--accent); font-size:13.5px; font-weight:600; margin-bottom:8px; }
.tl-loc{ font-size:12.5px; color:var(--text-faint); margin-bottom:24px; display:flex; align-items:center; gap:6px; }
.tl-loc svg{ width:13px; height:13px; }

.tl-steps{ position:relative; padding-left:28px; }
.tl-steps::before{
  content:""; position:absolute; left:5px; top:8px; bottom:8px; width:2px;
  background:linear-gradient(180deg, var(--accent), var(--accent-2), transparent);
}
.tl-block{ position:relative; margin-bottom:16px; }
.tl-block:last-child{ margin-bottom:0; }
.tl-block::before{
  content:""; position:absolute; left:-28px; top:18px; width:12px; height:12px; border-radius:50%;
  background:var(--bg); border:2px solid var(--accent); box-shadow:0 0 0 4px var(--accent-soft);
}
.tl-card{
  background:var(--surface-2); border:1px solid var(--border-soft); border-radius:var(--r-md);
  padding:18px 22px;
  transition:border-color .22s var(--ease), background .22s var(--ease), transform .22s var(--ease);
}
.tl-card:hover{ border-color:rgba(91,140,255,0.3); transform:translateX(3px); }
.tl-card .b-title{ font-size:14.5px; font-weight:700; margin-bottom:11px; letter-spacing:-0.01em; }
.tl-card ul{ display:flex; flex-direction:column; gap:8px; }
.tl-card li{ font-size:13.5px; color:var(--text-muted); position:relative; padding-left:17px; }
.tl-card li::before{
  content:""; position:absolute; left:0; top:7px; width:6px; height:6px; border-radius:2px;
  background:var(--accent); opacity:.55;
}
.tl-stats{ display:flex; flex-wrap:wrap; gap:7px; margin-top:14px; }
.tl-stats span{
  font-size:11px; font-weight:650; color:var(--accent-2);
  background:var(--mint-soft); border:1px solid var(--mint-border);
  padding:5px 10px; border-radius:var(--r-pill);
}

@media (max-width:680px){ .tl-steps{ padding-left:22px; } .tl-block::before{ left:-22px; } .tl-card{ padding:16px 16px; } }

/* ============================================================
   PROJECT CARDS + SCREENSHOTS
   ============================================================ */
.card-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:20px; }
.card{
  position:relative; display:flex; flex-direction:column;
  background:var(--surface-2); border:1px solid var(--border-soft); border-radius:var(--r-lg);
  overflow:hidden;
  transition:transform .25s var(--ease), border-color .25s var(--ease), box-shadow .25s var(--ease);
}
.card::after{
  content:""; position:absolute; inset:0; opacity:0; z-index:0; pointer-events:none;
  background:radial-gradient(500px circle at var(--mx,50%) var(--my,50%), var(--accent-soft), transparent 55%);
  transition:opacity .35s var(--ease);
}
.card:hover{ transform:translateY(-6px); border-color:rgba(91,140,255,0.38); box-shadow:var(--shadow-lift); }
.card:hover::after{ opacity:1; }

/* --- cover / screenshot --- */
.shot-cover{
  position:relative; display:block; width:100%; aspect-ratio:16/9;
  border:0; padding:0; margin:0; cursor:pointer; overflow:hidden;
  background:linear-gradient(135deg, var(--surface-3), var(--surface-2));
  border-bottom:1px solid var(--border-soft);
}
.shot-cover img{
  width:100%; height:100%; object-fit:cover; object-position:top center;
  transition:transform .5s var(--ease-out), filter .3s var(--ease);
}
.card:hover .shot-cover img{ transform:scale(1.05); }
.shot-cover::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg, transparent 45%, rgba(5,8,14,0.72) 100%);
  opacity:.85; pointer-events:none;
}
:root[data-theme="light"] .shot-cover::after{ background:linear-gradient(180deg, transparent 45%, rgba(10,16,32,0.55) 100%); }
.shot-cover .shot-hint{
  position:absolute; z-index:2; left:14px; bottom:12px;
  display:inline-flex; align-items:center; gap:7px;
  font-size:11.5px; font-weight:650; color:#fff;
  background:rgba(10,14,22,0.6); border:1px solid rgba(255,255,255,0.18);
  padding:6px 12px; border-radius:var(--r-pill);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  transform:translateY(4px); opacity:.92;
  transition:transform .25s var(--ease), opacity .25s var(--ease), background .25s var(--ease);
}
.shot-cover .shot-hint svg{ width:13px; height:13px; }
.card:hover .shot-cover .shot-hint{ transform:translateY(0); opacity:1; background:rgba(91,140,255,0.92); }

/* placeholder when image missing */
.shot-cover.is-empty{ display:flex; align-items:center; justify-content:center; cursor:default; }
.shot-cover.is-empty img, .shot-cover.is-empty .shot-hint{ display:none; }
.shot-cover.is-empty::after{ display:none; }
.shot-cover.is-empty::before{
  content:""; position:absolute; inset:0;
  background-image:repeating-linear-gradient(45deg, var(--shimmer) 0 12px, transparent 12px 24px);
  opacity:.55;
}
.shot-cover:not(.is-empty) .shot-empty-inner{ display:none; }
.shot-empty-inner{
  position:relative; z-index:1; text-align:center; color:var(--text-faint);
  display:flex; flex-direction:column; align-items:center; gap:8px; padding:0 18px;
}
.shot-empty-inner svg{ width:26px; height:26px; opacity:.6; }
.shot-empty-inner span{ font-size:11.5px; font-family:var(--mono); letter-spacing:.02em; }

.card-body{ position:relative; z-index:1; padding:20px 24px 24px; display:flex; flex-direction:column; flex:1; }
.card h3{ margin:0 0 12px; font-size:16px; font-weight:750; letter-spacing:-0.02em; }
.card ul{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
.card li{ font-size:13.5px; color:var(--text-muted); position:relative; padding-left:17px; }
.card li::before{
  content:""; position:absolute; left:0; top:7px; width:6px; height:6px; border-radius:2px;
  background:var(--accent-2); opacity:.6;
}

/* thumbnail strip */
.shot-strip{ display:flex; flex-wrap:wrap; gap:8px; margin:2px 0 16px; }
.shot-thumb{
  position:relative; width:64px; height:44px; flex-shrink:0;
  border-radius:9px; overflow:hidden; cursor:pointer; padding:0;
  border:1px solid var(--border); background:var(--surface-3);
  transition:transform .2s var(--ease), border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.shot-thumb img{ width:100%; height:100%; object-fit:cover; object-position:top center; }
.shot-thumb:hover{ transform:translateY(-3px) scale(1.06); border-color:var(--accent); box-shadow:0 8px 18px -8px var(--accent-glow); }
.shot-thumb.is-empty{ cursor:default; }
.shot-thumb.is-empty img{ display:none; }
.shot-thumb.is-empty::after{
  content:""; position:absolute; inset:0;
  background-image:repeating-linear-gradient(45deg, var(--shimmer) 0 7px, transparent 7px 14px);
}
.shot-thumb.is-empty:hover{ transform:none; border-color:var(--border); box-shadow:none; }
.shot-more{
  display:inline-flex; align-items:center; justify-content:center;
  height:44px; padding:0 12px; border-radius:9px;
  font-size:11.5px; font-weight:650; color:var(--accent);
  background:var(--accent-soft); border:1px solid rgba(91,140,255,0.25); cursor:pointer;
  transition:background .2s var(--ease), transform .2s var(--ease);
}
.shot-more:hover{ background:rgba(91,140,255,0.22); transform:translateY(-3px); }

.tag-list{ display:flex; flex-wrap:wrap; gap:6px; margin-top:auto; }
.tag-list span{
  font-size:10.5px; font-weight:650; color:var(--text-faint); font-family:var(--mono);
  border:1px solid var(--border); padding:4px 9px; border-radius:var(--r-pill);
  transition:color .18s var(--ease), border-color .18s var(--ease);
}
.card:hover .tag-list span{ color:var(--text-muted); border-color:var(--border-strong); }

@media (max-width:680px){ .card-grid{ grid-template-columns:1fr; } .card-body{ padding:18px 18px 20px; } }

/* ============================================================
   LIGHTBOX
   ============================================================ */
.lightbox{
  position:fixed; inset:0; z-index:200;
  display:flex; align-items:center; justify-content:center;
  background:rgba(5,7,12,0.88);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  opacity:0; visibility:hidden; transition:opacity .25s var(--ease), visibility .25s var(--ease);
  padding:72px 20px 92px;
}
.lightbox.open{ opacity:1; visibility:visible; }
.lb-figure{
  position:relative; max-width:min(1180px,100%); max-height:100%;
  display:flex; flex-direction:column; align-items:center; gap:14px;
}
.lb-figure img{
  max-width:100%; max-height:calc(100vh - 190px); object-fit:contain;
  border-radius:var(--r-md); border:1px solid rgba(255,255,255,0.14);
  box-shadow:var(--shadow-pop); background:#0b0e14;
}
.lb-caption{
  text-align:center; color:#E6EAF2; font-size:13.5px; max-width:720px;
}
.lb-caption .lb-proj{ display:block; color:#8E98AB; font-size:11.5px; font-family:var(--mono); margin-top:4px; }
.lb-top{
  position:absolute; top:18px; left:20px; right:20px;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
}
.lb-counter{
  font-family:var(--mono); font-size:12px; color:#C7CEDB;
  background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.14);
  padding:6px 13px; border-radius:var(--r-pill);
}
.lb-btn{
  display:flex; align-items:center; justify-content:center;
  width:42px; height:42px; border-radius:50%; cursor:pointer;
  background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.16); color:#fff;
  transition:background .18s var(--ease), transform .18s var(--ease), border-color .18s var(--ease);
}
.lb-btn:hover{ background:var(--accent); border-color:var(--accent); transform:scale(1.07); }
.lb-btn svg{ width:18px; height:18px; }
.lb-nav{ position:absolute; top:50%; transform:translateY(-50%); width:46px; height:46px; }
.lb-prev{ left:18px; }
.lb-next{ right:18px; }
.lb-nav:hover{ transform:translateY(-50%) scale(1.07); }
.lb-dots{
  position:absolute; bottom:24px; left:0; right:0;
  display:flex; justify-content:center; gap:8px; flex-wrap:wrap; padding:0 20px;
}
.lb-dot{
  width:9px; height:9px; border-radius:50%; cursor:pointer; padding:0;
  background:rgba(255,255,255,0.25); border:0;
  transition:background .2s var(--ease), transform .2s var(--ease), width .2s var(--ease);
}
.lb-dot.active{ background:var(--accent); width:24px; border-radius:var(--r-pill); }
body.lb-open{ overflow:hidden; }

@media (max-width:640px){
  .lightbox{ padding:64px 12px 80px; }
  .lb-nav{ width:38px; height:38px; }
  .lb-prev{ left:8px; } .lb-next{ right:8px; }
  .lb-figure img{ max-height:calc(100vh - 180px); }
}

/* ============================================================
   CREDENTIAL COLUMNS / LISTS
   ============================================================ */
.cred-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:20px; }
.cred-col .c-title{
  display:flex; align-items:center; gap:8px;
  font-size:11.5px; font-weight:700; color:var(--text); text-transform:uppercase;
  letter-spacing:.07em; margin-bottom:14px;
}
.cred-col .c-title svg{ width:15px; height:15px; color:var(--accent-2); }
.cred-list{ display:flex; flex-direction:column; gap:9px; }
.cred-item{
  background:var(--surface-2); border:1px solid var(--border-soft); border-radius:var(--r-sm);
  padding:13px 15px;
  transition:border-color .2s var(--ease), transform .2s var(--ease), background .2s var(--ease);
}
.cred-item:hover{ border-color:rgba(124,242,192,0.35); transform:translateX(4px); }
.cred-item .i-title{ font-size:13.5px; font-weight:650; display:block; }
.cred-item .i-sub{ font-size:12px; color:var(--text-faint); font-family:var(--mono); display:block; margin-top:4px; }

.simple-list{ display:flex; flex-direction:column; }
.simple-list li{
  display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  padding:14px 6px; border-bottom:1px solid var(--border-soft); border-radius:var(--r-sm);
  transition:background .18s var(--ease), padding .18s var(--ease);
}
.simple-list li:last-child{ border-bottom:none; }
.simple-list li:hover{ background:var(--surface-2); padding-left:14px; padding-right:14px; }
.simple-list .li-title{ font-size:14.5px; font-weight:600; position:relative; padding-left:17px; }
.simple-list .li-title::before{ content:""; position:absolute; left:0; top:7px; width:7px; height:7px; border-radius:50%; background:var(--accent); }
.simple-list .li-sub{ font-size:12px; color:var(--text-faint); font-family:var(--mono); }

@media (max-width:520px){
  .simple-list li{ flex-direction:column; align-items:flex-start; gap:4px; }
  .simple-list .li-sub{ padding-left:17px; }
}

/* ============================================================
   CONTACT PANEL
   ============================================================ */
.contact-panel{ text-align:center; }
.contact-panel .c-lead{ font-size:clamp(20px,3vw,26px); font-weight:750; letter-spacing:-0.025em; margin-bottom:10px; }
.contact-panel .c-sub{ color:var(--text-muted); font-size:14.5px; max-width:540px; margin:0 auto 24px; }
.contact-tiles{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-bottom:26px; }
.contact-tile{
  display:flex; align-items:center; gap:12px; text-align:left; text-decoration:none;
  background:var(--surface-2); border:1px solid var(--border-soft); border-radius:var(--r-md);
  padding:15px 17px;
  transition:border-color .2s var(--ease), transform .2s var(--ease), background .2s var(--ease);
}
.contact-tile:hover{ border-color:var(--accent); transform:translateY(-3px); background:var(--accent-soft); }
.contact-tile .ic{
  width:36px; height:36px; flex-shrink:0; border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  background:var(--accent-soft); color:var(--accent); border:1px solid rgba(91,140,255,0.2);
}
.contact-tile .ic svg{ width:16px; height:16px; }
.contact-tile .t-lbl{ font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; }
.contact-tile .t-val{ font-size:13.5px; font-weight:600; word-break:break-word; }

/* ============================================================
   BACK TO TOP + FOOTER
   ============================================================ */
.to-top{
  position:fixed; right:22px; bottom:22px; z-index:90;
  width:44px; height:44px; border-radius:50%; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  background:var(--nav-bg-solid); border:1px solid var(--border); color:var(--text);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  box-shadow:var(--shadow-lift);
  opacity:0; visibility:hidden; transform:translateY(12px) scale(.9);
  transition:opacity .25s var(--ease), transform .25s var(--ease), visibility .25s var(--ease), background .2s var(--ease);
}
.to-top.show{ opacity:1; visibility:visible; transform:translateY(0) scale(1); }
.to-top:hover{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
.to-top svg{ width:17px; height:17px; }
@media (max-width:540px){ .to-top{ right:14px; bottom:14px; width:40px; height:40px; } }

footer{
  border-top:1px solid var(--border-soft);
  padding:32px 24px 46px; text-align:center;
}
.foot-inner{ max-width:var(--maxw); margin:0 auto; display:flex; flex-direction:column; gap:10px; align-items:center; }
.foot-links{ display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
.foot-links a{
  font-size:12.5px; color:var(--text-muted); text-decoration:none;
  transition:color .18s var(--ease);
}
.foot-links a:hover{ color:var(--accent); }
.foot-note{ font-size:11.5px; color:var(--text-faint); letter-spacing:.03em; }

/* ============================================================
   PRINT
   ============================================================ */
@media print{
  .navbar-wrap, .to-top, .progress-rail, .bg-decor, .lightbox, .cta-row{ display:none !important; }
  body{ background:#fff; color:#000; }
  .panel{ opacity:1 !important; transform:none !important; border-color:#ccc; box-shadow:none; break-inside:avoid; }
  .hero{ padding-top:20px; }
}
</style>

const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function yearsExperience(startDateStr){
  const start = new Date(startDateStr);
  const now = new Date();
  let months = (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth());
  if(now.getDate() < start.getDate()) months -= 1;
  months = Math.max(months, 0);
  const years = Math.floor(months / 12);
  const rem = months % 12;
  if(rem >= 6) return String(years + 1);      // 3y 9m reads as "4"
  return rem > 0 ? `${years}+` : String(years);
}

/* ============================================================
   COUNT-UP FOR KPI VALUES
   ============================================================ */
function countUp(el, raw){
  const match = String(raw).match(/^(\D*)([\d.]+)(.*)$/);
  if(!match || prefersReduced){ el.textContent = raw; return; }
  const [, pre, numStr, post] = match;
  const target = parseFloat(numStr);
  const decimals = (numStr.split(".")[1] || "").length;
  const duration = 1100;
  const start = performance.now();
  function frame(now){
    const t = Math.min((now - start) / duration, 1);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = pre + (target * eased).toFixed(decimals) + post;
    if(t < 1) requestAnimationFrame(frame);
    else el.textContent = pre + numStr + post;
  }
  requestAnimationFrame(frame);
}

  $("#heroName").innerHTML = `<span class="grad">${esc(portfolio.name)}</span>`;
  $("#heroSummary").textContent = withYears(portfolio.tagline);

  const avatarSlot = $("#avatarSlot");
  if(portfolio.photo.type === "image"){
    avatarSlot.innerHTML = `<img src="${esc(portfolio.photo.src)}" alt="Portrait of ${esc(portfolio.name)}">`;
    const img = avatarSlot.querySelector("img");
    img.addEventListener("error", () => {
      avatarSlot.textContent = portfolio.name.split(" ").map(w => w[0]).slice(0, 2).join("");
    });
  } else {
    avatarSlot.textContent = portfolio.photo.value;
  }

  $("#contactStrip").innerHTML = portfolio.contact.map(c => {
    const ic = ICON[c.icon] || "";
    return c.href
      ? `<a href="${esc(c.href)}"${c.href.startsWith("http") ? ' target="_blank" rel="noopener"' : ""}>${ic}<span>${esc(c.value)}</span></a>`
      : `<span>${ic}<span>${esc(c.value)}</span></span>`;
  }).join("");

  const linkedin = portfolio.contact.find(c => c.icon === "link");
  $("#ctaSlot").innerHTML = `
    ${portfolio.resume ? `<a class="btn btn-primary" href="${esc(portfolio.resume)}" download>${ICON.download}<span>Download Résumé</span></a>` : ""}
    <a class="btn btn-ghost" href="#projects">${ICON.image}<span>View Projects</span></a>
    ${linkedin ? `<a class="btn btn-ghost" href="${esc(linkedin.href)}" target="_blank" rel="noopener">${ICON.link}<span>LinkedIn</span></a>` : ""}`;

  // KPIs
  $("#statStrip").innerHTML = portfolio.stats.map(s => {
    const value = s.dynamic === "years" ? yearsLabel : s.num;
    return `<div class="kpi"><div class="num" data-value="${esc(value)}">0</div><div class="lbl">${esc(s.label)}</div></div>`;
  }).join("");

  // nav
  $("#navLinks").innerHTML = portfolio.sections
    .map(s => `<a href="#${s.id}" data-id="${s.id}">${esc(s.title)}</a>`).join("");

  // panels
  $("#panels").innerHTML = portfolio.sections.map(s => {
    const countBadge = s.type === "cards" ? `<span class="count">${s.content.length} projects</span>` : "";
    return `
    <section class="panel" id="${s.id}" aria-labelledby="h-${s.id}">
      <div class="panel-head">
        <span class="bar" aria-hidden="true"></span>
        <h2 id="h-${s.id}">${esc(s.title)}</h2>
        ${countBadge}
      </div>
      ${renderers[s.type] ? renderers[s.type](s.content) : ""}
    </section>`;
  }).join("");

  // footer links
  $("#footLinks").innerHTML = portfolio.contact
    .filter(c => c.href)
    .map(c => `<a href="${esc(c.href)}"${c.href.startsWith("http") ? ' target="_blank" rel="noopener"' : ""}>${esc(c.label)}</a>`)
    .join("") + (portfolio.resume ? `<a href="${esc(portfolio.resume)}" download>Résumé</a>` : "");

  // icon buttons
  $("#themeToggle").innerHTML = ICON.sun + ICON.moon;
  $("#navToggle").innerHTML = ICON.menu;
  $("#toTop").innerHTML = ICON.arrowUp;
  $("#lbClose").innerHTML = ICON.close;
  $("#lbPrev").innerHTML = ICON.chevL;
  $("#lbNext").innerHTML = ICON.chevR;

  injectStructuredData();
}

function injectStructuredData(){
  const email = (portfolio.contact.find(c => c.icon === "mail") || {}).value;
  const li = (portfolio.contact.find(c => c.icon === "link") || {}).href;
  const data = {
    "@context": "https://schema.org",
    "@type": "Person",
    name: portfolio.name,
    jobTitle: "ERP Technical Consultant",
    email: email ? `mailto:${email}` : undefined,
    url: location.href.split("#")[0],
    sameAs: li ? [li] : undefined,
    address: { "@type": "PostalAddress", addressLocality: "Hyderabad", addressCountry: "IN" },
    worksFor: { "@type": "Organization", name: "MindSuite Informatics Private Limited" },
    knowsAbout: ["NetSuite", "SuiteScript 2.x", "SuiteCloud Development Framework", "Suitelet", "RESTlet", "SuiteFlow", "SuiteQL", "React.js", "Odoo ERP"]
  };
  const tag = document.createElement("script");
  tag.type = "application/ld+json";
  tag.textContent = JSON.stringify(data);
  document.head.appendChild(tag);
}

build();

/* ============================================================
   SCREENSHOT FALLBACKS
   Images that fail to load become styled placeholders and are
   removed from the lightbox set — nothing ever shows as broken.
   ============================================================ */
const projectsSection = portfolio.sections.find(s => s.type === "cards");
const shotAvailability = {};   // { projectIndex: Set(indices that loaded) }

function markLoaded(pi, idx, ok){
  (shotAvailability[pi] = shotAvailability[pi] || new Set());
  if(ok) shotAvailability[pi].add(idx);
  // keep the cover badge honest: count only screenshots that actually load
  const hint = document.querySelector(`.shot-cover[data-project="${pi}"] .shot-hint > span`);
  if(hint){
    const n = availableShots(pi).length;
    hint.textContent = n > 1 ? `View ${n} screenshots` : "View screenshot";
  }
}

$$(".shot-cover img, .shot-thumb img").forEach(img => {
  const pi  = Number(img.dataset.project);
  const idx = Number(img.dataset.index);
  const fail = () => { img.closest("button").classList.add("is-empty"); markLoaded(pi, idx, false); };
  const ok   = () => markLoaded(pi, idx, true);
  if(img.complete){ (img.naturalWidth > 0 ? ok : fail)(); }
  else { img.addEventListener("load", ok); img.addEventListener("error", fail); }
});

/* ============================================================
   LIGHTBOX
   ============================================================ */
const lb = {
  el:      $("#lightbox"),
  img:     $("#lbImage"),
  caption: $("#lbCaption"),
  counter: $("#lbCounter"),
  dots:    $("#lbDots"),
  items:   [],
  index:   0,
  opener:  null
};

function availableShots(pi){
  const project = projectsSection.content[pi];
  if(!project || !project.screenshots) return [];
  const loaded = shotAvailability[pi];
  return project.screenshots
    .map((s, i) => ({ ...s, i, project: project.title }))
    .filter(s => !loaded || loaded.has(s.i) || s.i > 3);   // thumbs beyond the strip are untested
}

function openLightbox(pi, startIdx, opener){
  const items = availableShots(pi);
  if(!items.length) return;
  lb.items = items;
  lb.index = Math.max(0, items.findIndex(s => s.i === startIdx));
  lb.opener = opener || null;
  renderLightbox();
  lb.el.classList.add("open");
  document.body.classList.add("lb-open");
  $("#lbClose").focus();
}

function renderLightbox(){
  const item = lb.items[lb.index];
  if(!item) return;
  lb.img.src = item.src;
  lb.img.alt = item.caption || item.project;
  lb.caption.innerHTML = `${esc(item.caption || "")}<span class="lb-proj">${esc(item.project)}</span>`;
  lb.counter.textContent = `${lb.index + 1} / ${lb.items.length}`;
  lb.dots.innerHTML = lb.items.map((_, i) =>
    `<button class="lb-dot${i === lb.index ? " active" : ""}" data-dot="${i}" aria-label="Screenshot ${i + 1}"></button>`).join("");
  const multi = lb.items.length > 1;
  $("#lbPrev").style.display = multi ? "" : "none";
  $("#lbNext").style.display = multi ? "" : "none";
  lb.dots.style.display = multi ? "" : "none";
}

function closeLightbox(){
  lb.el.classList.remove("open");
  document.body.classList.remove("lb-open");
  lb.img.src = "";
  if(lb.opener) lb.opener.focus();
}
const stepLightbox = (d) => { lb.index = (lb.index + d + lb.items.length) % lb.items.length; renderLightbox(); };

// delegate clicks on covers / thumbs / "+N more"
document.addEventListener("click", (e) => {
  const trigger = e.target.closest(".shot-cover, .shot-thumb, .shot-more");
  if(trigger && !trigger.classList.contains("is-empty")){
    openLightbox(Number(trigger.dataset.project), Number(trigger.dataset.index), trigger);
    return;
  }
  const dot = e.target.closest(".lb-dot");
  if(dot){ lb.index = Number(dot.dataset.dot); renderLightbox(); return; }
});

$("#lbClose").addEventListener("click", closeLightbox);
$("#lbPrev").addEventListener("click", () => stepLightbox(-1));
$("#lbNext").addEventListener("click", () => stepLightbox(1));
lb.el.addEventListener("click", (e) => { if(e.target === lb.el || e.target.classList.contains("lb-figure")) closeLightbox(); });
lb.img.addEventListener("error", () => { lb.caption.innerHTML = "Screenshot unavailable."; });

document.addEventListener("keydown", (e) => {
  if(!lb.el.classList.contains("open")) return;
  if(e.key === "Escape") closeLightbox();
  if(e.key === "ArrowLeft") stepLightbox(-1);
  if(e.key === "ArrowRight") stepLightbox(1);
});

// swipe on touch devices
let touchX = null;
lb.el.addEventListener("touchstart", (e) => { touchX = e.changedTouches[0].clientX; }, { passive:true });
lb.el.addEventListener("touchend", (e) => {
  if(touchX === null || lb.items.length < 2) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx) > 48) stepLightbox(dx < 0 ? 1 : -1);
  touchX = null;
}, { passive:true });

/* ============================================================
   THEME
   ============================================================ */
const THEME_KEY = "salim-portfolio-theme";
function applyTheme(theme, persist){
  document.documentElement.setAttribute("data-theme", theme);
  if(persist){ try{ localStorage.setItem(THEME_KEY, theme); }catch(_){} }
}
(function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem(THEME_KEY); }catch(_){}
  applyTheme(saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"), false);
})();
$("#themeToggle").addEventListener("click", () => {
  applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark", true);
});

/* ============================================================
   NAV / MOBILE MENU
   ============================================================ */
const navToggle = $("#navToggle");
const navLinksEl = $("#navLinks");
navToggle.addEventListener("click", () => {
  const open = navLinksEl.classList.toggle("open");
  navToggle.setAttribute("aria-expanded", String(open));
  navToggle.innerHTML = open ? ICON.close : ICON.menu;
});
navLinksEl.querySelectorAll("a").forEach(a => a.addEventListener("click", () => {
  navLinksEl.classList.remove("open");
  navToggle.setAttribute("aria-expanded", "false");
  navToggle.innerHTML = ICON.menu;
}));
document.addEventListener("click", (e) => {
  if(!e.target.closest(".navbar") && navLinksEl.classList.contains("open")){
    navLinksEl.classList.remove("open");
    navToggle.setAttribute("aria-expanded", "false");
    navToggle.innerHTML = ICON.menu;
  }
});

/* ============================================================
   SCROLL EFFECTS
   ============================================================ */
const navbar = $("#navbar");
const progressBar = $("#progressBar");
const toTop = $("#toTop");

function onScroll(){
  const y = window.scrollY;
  const h = document.documentElement.scrollHeight - window.innerHeight;
  progressBar.style.width = (h > 0 ? (y / h) * 100 : 0) + "%";
  navbar.classList.toggle("scrolled", y > 12);
  toTop.classList.toggle("show", y > 500);
}
window.addEventListener("scroll", onScroll, { passive:true });
onScroll();

toTop.addEventListener("click", () => {
  window.scrollTo({ top:0, behavior: prefersReduced ? "auto" : "smooth" });
});

/* reveal panels + stagger */
const panels = $$(".panel");
const navAnchors = $$(".navlinks a");

const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach((e, i) => {
    if(e.isIntersecting){
      e.target.style.transitionDelay = `${Math.min(i * 60, 180)}ms`;
      e.target.classList.add("is-visible");
      revealObserver.unobserve(e.target);
    }
  });
}, { threshold:0.08, rootMargin:"0px 0px -40px 0px" });
panels.forEach(p => revealObserver.observe(p));

/* active nav link */
const activeObserver = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if(e.isIntersecting){
      navAnchors.forEach(a => a.classList.toggle("active", a.dataset.id === e.target.id));
    }
  });
}, { threshold:0.25, rootMargin:"-25% 0px -55% 0px" });
panels.forEach(p => activeObserver.observe(p));

/* KPI count-up once visible */
const kpiObserver = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if(e.isIntersecting){
      countUp(e.target, e.target.dataset.value);
      kpiObserver.unobserve(e.target);
    }
  });
}, { threshold:0.5 });
$$(".kpi .num").forEach(n => kpiObserver.observe(n));

/* ============================================================
   POINTER SPOTLIGHT ON CARDS
   ============================================================ */
if(!prefersReduced && window.matchMedia("(hover: hover)").matches){
  document.addEventListener("pointermove", (e) => {
    const host = e.target.closest(".card, .kpi");
    if(!host) return;
    const r = host.getBoundingClientRect();
    host.style.setProperty("--mx", `${e.clientX - r.left}px`);
    host.style.setProperty("--my", `${e.clientY - r.top}px`);
  }, { passive:true });
}

/* ============================================================
   TYPED ROLE LINE
   ============================================================ */
(function typeLoop(){
  const el = $("#typedText");
  const phrases = portfolio.typed || [];
  if(!el || !phrases.length) return;
  if(prefersReduced){ el.textContent = phrases[0]; return; }

  let p = 0, c = 0, deleting = false;
  function tick(){
    const full = phrases[p];
    c += deleting ? -1 : 1;
    el.textContent = full.slice(0, c);
    let delay = deleting ? 32 : 58;
    if(!deleting && c === full.length){ delay = 1700; deleting = true; }
    else if(deleting && c === 0){ deleting = false; p = (p + 1) % phrases.length; delay = 320; }
    setTimeout(tick, delay);
  }
  tick();
})();
</script>
